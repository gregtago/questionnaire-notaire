<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Répertoire état civil — Grégoire TAGOT | notaire</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f7f7f5; color: #1a1a1a; font-size: 15px; line-height: 1.5; }
    .header { background: #111; color: #fff; }
    .header .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .header .cabinet { font-size: 13px; letter-spacing: .04em; color: rgba(255,255,255,.55); }
    .header .title-bar { padding: 14px 28px 18px; background: #1a1a1a; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .header h1 { font-size: 22px; font-weight: 300; }
    .header .compte { font-size: 12px; color: rgba(255,255,255,.45); }
    .btn-sortir { background: none; border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.7); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; }
    .btn-sortir:hover { border-color: rgba(255,255,255,.6); color: #fff; }

    .screen { max-width: 420px; margin: 60px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 40px; }
    .card h2 { font-size: 20px; font-weight: 400; margin-bottom: 8px; }
    .card p { color: #777; font-size: 14px; margin-bottom: 28px; }
    .fg { margin-bottom: 20px; }
    .fg label { display: block; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: #888; margin-bottom: 6px; }
    .fg input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 15px; outline: none; font-family: inherit; }
    .fg input:focus { border-color: #111; }
    .code-input { text-align: center; font-size: 28px; letter-spacing: .3em; font-weight: 600; }
    .btn { width: 100%; padding: 12px; background: #111; color: #fff; border: none; border-radius: 4px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; font-family: inherit; }
    .btn:hover { background: #333; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .err { color: #c0392b; font-size: 13px; margin-top: 8px; min-height: 18px; }

    .wrap { max-width: 1400px; margin: 24px auto 60px; padding: 0 20px; }
    .barre { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .barre input[type=search], .barre select { padding: 9px 11px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; background: #fff; outline: none; }
    .barre input[type=search] { flex: 1 1 240px; min-width: 0; }
    .barre input[type=search]:focus, .barre select:focus { border-color: #111; }
    .compteur { font-size: 12px; color: #888; letter-spacing: .04em; margin-left: auto; }
    .btn-sec { padding: 9px 14px; background: #fff; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; font-family: inherit; color: #444; }
    .btn-sec:hover { border-color: #111; color: #111; }

    /* Le tableau défile dans son cadre : la page ne part jamais en largeur. */
    .cadre { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
    thead th { position: sticky; top: 0; background: #fafafa; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #999; padding: 10px 12px; border-bottom: 1px solid #e5e5e5; cursor: pointer; user-select: none; }
    thead th:hover { color: #111; }
    thead th .fleche { color: #ccc; margin-left: 4px; }
    thead th[aria-sort] .fleche { color: #111; }
    tbody td { padding: 9px 12px; border-bottom: 1px solid #f2f2f2; color: #333; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }
    td.nom { font-weight: 600; color: #111; }
    .puce { display: inline-block; padding: 2px 7px; margin-right: 4px; background: #f0f0ee; border-radius: 3px; font-size: 11px; color: #666; }
    .vide { padding: 40px; text-align: center; color: #999; font-size: 14px; }
    .hidden { display: none; }

    @media (max-width: 600px) {
      .header .top-bar, .header .title-bar { padding-left: 18px; padding-right: 18px; }
      .card { padding: 28px; }
      .compteur { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="top-bar">
    <span class="cabinet">Grégoire TAGOT | notaire</span>
  </div>
  <div class="title-bar">
    <h1>Répertoire état civil</h1>
    <span class="compte" id="compte"></span>
    <button class="btn-sortir hidden" id="btnSortir" type="button">Fermer la session</button>
  </div>
</div>

<!-- Accès -->
<div class="screen" id="ecranCode">
  <div class="card">
    <h2>Accès réservé</h2>
    <p>Saisissez le code à 6 chiffres affiché par votre application d'authentification.</p>
    <form id="formCode">
      <div class="fg">
        <label for="code">Code de vérification</label>
        <input type="text" id="code" class="code-input" maxlength="6" inputmode="numeric"
               autocomplete="one-time-code" required>
      </div>
      <button class="btn" id="btnEntrer" type="submit">Ouvrir le répertoire</button>
      <div class="err" id="errCode"></div>
    </form>
  </div>
</div>

<!-- Répertoire -->
<div class="wrap hidden" id="ecranTable">
  <div class="barre">
    <input type="search" id="recherche" placeholder="Rechercher un nom, une ville, un email…" autocomplete="off">
    <select id="filtreDossier"><option value="">Tous les dossiers</option></select>
    <button class="btn-sec" id="btnExport" type="button">Exporter en CSV</button>
    <span class="compteur" id="compteur"></span>
  </div>
  <div class="cadre">
    <table>
      <thead><tr id="entetes"></tr></thead>
      <tbody id="lignes"></tbody>
    </table>
    <div class="vide hidden" id="aucun">Aucune fiche ne correspond.</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const COLONNES = [
  { cle: 'nom',        titre: 'Nom' },
  { cle: 'prenom',     titre: 'Prénom' },
  { cle: 'email',      titre: 'Email' },
  { cle: 'telephone',  titre: 'Téléphone' },
  { cle: 'adresse',    titre: 'Adresse' },
  { cle: 'codePostal', titre: 'CP' },
  { cle: 'ville',      titre: 'Ville' },
  { cle: 'naissance',  titre: 'Naissance' },
  { cle: 'dossiers',   titre: 'Dossier' },
  { cle: 'creeLe',     titre: 'Reçu le' }
];

let fiches = [];
let tri = { cle: 'nom', sens: 1 };

// La session ne survit pas à la fermeture de l'onglet.
const session = {
  get: () => sessionStorage.getItem('repertoireJeton'),
  set: j => sessionStorage.setItem('repertoireJeton', j),
  effacer: () => sessionStorage.removeItem('repertoireJeton')
};

/* ── Accès ─────────────────────────────────────────────────────────────── */

$('formCode').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('code').value.replace(/\D/g, '');
  const err = $('errCode');
  err.textContent = '';
  if (code.length !== 6) { err.textContent = 'Code à 6 chiffres requis.'; return; }

  const btn = $('btnEntrer');
  btn.disabled = true;
  btn.textContent = 'Vérification…';
  try {
    const r = await fetch('/api/repertoire-connexion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Accès refusé.');
    session.set(d.token);
    await charger();
  } catch (ex) {
    err.textContent = ex.message;
    $('code').value = '';
    $('code').focus();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ouvrir le répertoire';
  }
});

$('btnSortir').addEventListener('click', () => {
  session.effacer();
  fiches = [];
  $('lignes').innerHTML = '';
  $('ecranTable').classList.add('hidden');
  $('btnSortir').classList.add('hidden');
  $('compte').textContent = '';
  $('ecranCode').classList.remove('hidden');
  $('code').value = '';
  $('code').focus();
});

async function charger() {
  const r = await fetch('/api/repertoire', { headers: { Authorization: 'Bearer ' + session.get() } });
  if (r.status === 401) { session.effacer(); throw new Error('Session expirée, ressaisissez un code.'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Lecture impossible.');

  fiches = d.fiches || [];
  $('ecranCode').classList.add('hidden');
  $('ecranTable').classList.remove('hidden');
  $('btnSortir').classList.remove('hidden');
  $('compte').textContent = fiches.length + ' fiche' + (fiches.length > 1 ? 's' : '');
  remplirFiltreDossier();
  dessinerEntetes();
  dessiner();
}

/* ── Tableau ───────────────────────────────────────────────────────────── */

function remplirFiltreDossier() {
  const dossiers = [...new Set(fiches.flatMap(f => f.dossiers || []))].sort((a, b) => a.localeCompare(b, 'fr'));
  $('filtreDossier').innerHTML = '<option value="">Tous les dossiers</option>'
    + dossiers.map(d => `<option value="${echapper(d)}">${echapper(d)}</option>`).join('');
}

function dessinerEntetes() {
  $('entetes').innerHTML = COLONNES.map(c =>
    `<th data-cle="${c.cle}"${tri.cle === c.cle ? ` aria-sort="${tri.sens > 0 ? 'ascending' : 'descending'}"` : ''}>`
    + echapper(c.titre)
    + `<span class="fleche">${tri.cle === c.cle ? (tri.sens > 0 ? '▲' : '▼') : '↕'}</span></th>`
  ).join('');
  $('entetes').querySelectorAll('th').forEach(th => {
    th.onclick = () => {
      const cle = th.dataset.cle;
      tri = { cle, sens: tri.cle === cle ? -tri.sens : 1 };
      dessinerEntetes();
      dessiner();
    };
  });
}

function filtrees() {
  const q = normaliser($('recherche').value.trim());
  const dossier = $('filtreDossier').value;
  let out = fiches;

  if (dossier) out = out.filter(f => (f.dossiers || []).includes(dossier));
  if (q) {
    const mots = q.split(/\s+/);
    out = out.filter(f => {
      const foin = normaliser(COLONNES.map(c => valeur(f, c.cle)).join(' '));
      return mots.every(m => foin.includes(m));
    });
  }

  return [...out].sort((a, b) => {
    const va = valeur(a, tri.cle), vb = valeur(b, tri.cle);
    if (!va && vb) return 1;          // les cases vides finissent en bas
    if (va && !vb) return -1;
    return va.localeCompare(vb, 'fr', { numeric: true }) * tri.sens;
  });
}

function dessiner() {
  const liste = filtrees();
  $('lignes').innerHTML = liste.map(f => '<tr>' + COLONNES.map(c => {
    if (c.cle === 'dossiers') {
      return '<td>' + (f.dossiers || []).map(d => `<span class="puce">${echapper(d)}</span>`).join('') + '</td>';
    }
    const classe = c.cle === 'nom' ? ' class="nom"' : '';
    return `<td${classe}>${echapper(afficher(f, c.cle))}</td>`;
  }).join('') + '</tr>').join('');

  $('aucun').classList.toggle('hidden', liste.length > 0);
  $('compteur').textContent = liste.length === fiches.length
    ? `${fiches.length} fiche${fiches.length > 1 ? 's' : ''}`
    : `${liste.length} sur ${fiches.length}`;
}

$('recherche').addEventListener('input', dessiner);
$('filtreDossier').addEventListener('change', dessiner);

/* ── Export ────────────────────────────────────────────────────────────── */

$('btnExport').addEventListener('click', () => {
  const liste = filtrees();
  const ligne = cs => cs.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';');
  const csv = [
    ligne(COLONNES.map(c => c.titre)),
    ...liste.map(f => ligne(COLONNES.map(c => afficher(f, c.cle))))
  ].join('\r\n');

  // Séparateur point-virgule et marque d'ordre : Excel en français ouvre le
  // fichier directement, colonnes séparées et accents intacts.
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `repertoire-etat-civil-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

/* ── Utilitaires ───────────────────────────────────────────────────────── */

function valeur(f, cle) {
  const v = f[cle];
  return Array.isArray(v) ? v.join(' ') : String(v == null ? '' : v);
}

function afficher(f, cle) {
  const v = valeur(f, cle);
  if (!v) return '';
  // Les dates arrivent en AAAA-MM-JJ : on les rend à la française.
  if ((cle === 'naissance' || cle === 'creeLe') && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
    const [a, m, j] = v.split('-');
    return `${j}/${m}/${a}`;
  }
  return v;
}

const echapper = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const normaliser = s => String(s == null ? '' : s)
  .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/* ── Reprise de session ────────────────────────────────────────────────── */

if (session.get()) {
  charger().catch(() => {
    session.effacer();
    $('code').focus();
  });
} else {
  $('code').focus();
}
</script>
</body>
</html>
